# Enable the Corne RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=n
# Enable automatic sleep after five minutes of inactivity.
# The display can blank earlier to reduce power draw and BLE instability.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Enable the Corne OLED display.
CONFIG_ZMK_DISPLAY=n
 CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# Do not blank the OLED when RGB/backlight state changes.
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n


# Enable the Corne RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=y
# Enable automatic sleep after five minutes of inactivity.
# The display can blank earlier to reduce power draw and BLE instability.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Enable the Corne OLED display.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# Do not blank the OLED when RGB/backlight state changes.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Reduce the time before a key press is accepted by the matrix debounce.
CONFIG_ZMK_DEBOUNCE_PRESS_MS=2
CONFIG_ZMK_DEBOUNCE_RELEASE_MS=5
